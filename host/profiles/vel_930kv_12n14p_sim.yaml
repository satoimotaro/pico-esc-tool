# Generated by velcal.py --dry-run (a MODEL of the ESC, not HW truth).
#
# [2026-08-01] IT ALSO PREDATES THE DUTY-FLOOR HANDOFF LAW and disagrees with it. Its
# cross_up byte 54 puts the up-handoff at command 796.2 (motor_model.handoff_cmd), but the
# point at cmd 827 is tagged `sine` and carries 295.1 rpm — a speed no 930KV reaches in
# 6-step, so the tag cannot simply be flipped; the generating model never fired the
# handoff. Consequence: a --dry-run against this profile hands off somewhere the firmware
# does not, so dry-run crossover behaviour here is NOT evidence about the hardware.
# test_config.py exempts `source: sim` for exactly this reason. Regenerate from a bench
# velcal run to retire it.
