name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + test deps
        run: pip install platformio pyserial pytest pyyaml

      - name: Build all firmware environments
        run: pio run -e main -e main_uart -e main_panel

      - name: Compile-check the host tools
        run: python -m compileall -q host

      - name: Run host unit tests
        run: python -m pytest host/tests -q

      - name: Run native vel_control tests
        run: |
          cd lib/vel_control/test
          g++ -std=c++17 -O2 -Wall -o /tmp/tvc test_vel_control.cpp && /tmp/tvc
          g++ -std=c++17 -O2 -Wall -o /tmp/tmm test_motor_model.cpp && /tmp/tmm
          g++ -std=c++17 -O2 -Wall -o /tmp/tsg test_sense_gate.cpp  && /tmp/tsg

      - name: Run native esc_lifecycle test
        run: |
          cd lib/esc_lifecycle/test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -o /tmp/tlc test_esc_lifecycle.cpp && /tmp/tlc
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -o /tmp/tpins test_esc_pins.cpp && /tmp/tpins
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -o /tmp/tmt test_motor_test.cpp && /tmp/tmt
